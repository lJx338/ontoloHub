[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontolohub-cli"
version = "0.1.0"
description = "OntoloHub 命令行管理工具（typer）"
requires-python = ">=3.11"
authors = [{ name = "OntoloHub Team" }]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
]

# 安装后命令名：ontolohub
[project.scripts]
ontolohub = "ontolohub_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ontolohub_cli"]

[tool.hatch.build.targets.wheel.force-include]
"src/ontolohub_cli" = "ontolohub_cli"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]