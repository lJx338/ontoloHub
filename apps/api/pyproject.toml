[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontolohub-api"
version = "0.1.0"
description = "OntoloHub 后端 API（FastAPI）"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "OntoloHub Team" }]

# 这里故意保持依赖最小化——依赖清单在仓库根 requirements.txt。
# pip install -r requirements.txt 已经覆盖全部运行时依赖。
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "rich>=13.7.0",
]

[tool.hatch.build.targets.wheel]
# 可编辑安装时仅暴露 `src` 包，alembic/ 与 alembic.ini 留在原位即可被 CLI 调用。
only-include = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]