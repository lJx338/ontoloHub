# OntoloHub 本地开发编排
#
# 启动：   docker compose up -d
# 看日志： docker compose logs -f api
# 停掉：   docker compose down
# 重置：   docker compose down -v   （同时清空数据卷）
#
# 服务：
#   - postgres: PostgreSQL 16 主库
#   - redis:    Redis 7 缓存（M1 起；候选/映射/SHACL 报告/限流）
#   - api:      FastAPI 后端，自动跑 Alembic 迁移

services:
  postgres:
    image: postgres:16-alpine
    container_name: ontolohub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ontolohub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ontolohub"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # HIA-64 B1 — 缓存 / 限流 / 幂等键
    image: redis:7-alpine
    container_name: ontolohub-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ontolohub-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ontolohub
      DATABASE_ECHO: "false"
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      API_DEBUG: "false"
      LOG_LEVEL: INFO
      LOG_FORMAT: text
    ports:
      - "8000:8000"
    volumes:
      # 源码挂载，容器内 reload 不用 rebuild
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./scripts:/app/scripts

volumes:
  postgres_data:
    name: ontolohub_postgres_data
  redis_data:
    name: ontolohub_redis_data
